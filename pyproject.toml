[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "Evidence-backed RFP and security questionnaire workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl==3.1.5", "python-multipart==0.0.32", "defusedxml==0.7.1", "PyJWT[crypto]==2.15.0", "cryptography==50.0.2", "mcp==2.3.0", "psycopg[binary]==3.3.6", "langgraph==1.2.15", "langgraph-checkpoint==4.3.0", "langgraph-checkpoint-sqlite==3.1.2", "langsmith==0.14.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
a2a = ["a2a-sdk[http-server]==1.1.5", "protobuf==5.29.6", "google-api-core==2.25.1", "googleapis-common-protos==1.70.0", "proto-plus==1.28.2"]
autogen = ["autogen-core==0.7.5", "autogen-agentchat==0.7.5", "autogen-ext==0.7.5"]
operations = ["langsmith==0.14.8", "pip-audit==2.10.1"]
optimization = ["dspy==3.4.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql", "postgres_migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
