services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      EVIDENCEDESK_API_KEY: ${EVIDENCEDESK_API_KEY:?Set EVIDENCEDESK_API_KEY}
      EVIDENCEDESK_TENANT: demo
    volumes: ["evidence-data:/data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
volumes:
  evidence-data:
